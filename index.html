<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Time Progress</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>

  <div class="time-progress">

    <div class="progress-item">
      <div class="label">
        <span>WEEK</span>
        <span id="week-percent">0%</span>
      </div>
      <div class="bar">
        <div id="week-bar"></div>
      </div>
    </div>

    <div class="progress-item">
      <div class="label">
        <span>MONTH</span>
        <span id="month-percent">0%</span>
      </div>
      <div class="bar">
        <div id="month-bar"></div>
      </div>
    </div>

    <div class="progress-item">
      <div class="label">
        <span>YEAR</span>
        <span id="year-percent">0%</span>
      </div>
      <div class="bar">
        <div id="year-bar"></div>
      </div>
    </div>

  </div>

  <script src="./script.js"></script>

</body>
</html>
